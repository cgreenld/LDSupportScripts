<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LaunchDarkly Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">LD Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/audience">Audience</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ld-info">LD Information</a>
                    </li>
                    <li class="nav-item" id="aiConfigNavItem" {% if not is_ai_config_enabled %}style="display: none;"{% endif %}>
                        <a class="nav-link" href="/ai-config">AI Config</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/launchdarkly-js-client-sdk@2"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        // Initialize the LD client
        const ldClient = LDClient.initialize('{{ ld_client_id }}', {
            key: 'user-key',
            email: 'user@example.com'
        });

        // Function to update UI based on flag state
        function updateAIConfigVisibility(enabled) {
            const aiConfigNav = document.getElementById('aiConfigNavItem');
            const aiConfigCard = document.getElementById('aiConfigCard');
            
            if (aiConfigNav) aiConfigNav.style.display = enabled ? 'block' : 'none';
            if (aiConfigCard) aiConfigCard.style.display = enabled ? 'block' : 'none';
            
            // If on AI Config page and flag is disabled, redirect to home
            if (!enabled && window.location.pathname === '/ai-config') {
                window.location.href = '/';
            }
        }

        // Listen for flag changes
        ldClient.on('change', (changes) => {
            if (changes['ai-config-enabled'] !== undefined) {
                updateAIConfigVisibility(changes['ai-config-enabled'].current);
            }
        });

        // Initial flag check
        ldClient.waitUntilReady().then(() => {
            const isEnabled = ldClient.variation('ai-config-enabled', false);
            updateAIConfigVisibility(isEnabled);
        });
    </script>
</body>
</html>
